<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Pageview counter — Zhiyu Yang</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{color-scheme:light;--paper:#f6f5f0;--ink:#20211e;--muted:#696a63;--line:#d8d7ce;--accent:#a4573f}
    *{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{width:min(760px,calc(100% - 36px));margin:0 auto;padding:72px 0}h1{margin:0;font:400 42px/1.1 Georgia,"Times New Roman",serif;letter-spacing:-.04em}.eyebrow{margin:0 0 18px;color:var(--accent);font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}.muted{color:var(--muted)}.health{margin:20px 0 0;font-size:13px}form{display:flex;gap:10px;margin-top:28px}input,button{border:1px solid var(--line);border-radius:6px;padding:10px 13px;font:inherit}input{min-width:280px;background:#fffefa}button{color:#fffefa;border-color:var(--ink);background:var(--ink);cursor:pointer}#error{min-height:25px;color:var(--accent)}.summary{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:36px 0 42px}.metric{padding:20px;border:1px solid var(--line);background:#fffefa}.metric-label{color:var(--muted);font-size:11px;letter-spacing:.12em;text-transform:uppercase}.metric-value{margin-top:5px;font:400 42px/1 Georgia,"Times New Roman",serif}table{width:100%;border-collapse:collapse;margin-top:18px}th,td{padding:11px 8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}td:last-child,th:last-child{text-align:right}@media(max-width:560px){main{padding:44px 0}h1{font-size:36px}form{display:block}input{width:100%}button{margin-top:10px}.summary{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Private site analytics</p>
    <h1>Pageview counter</h1>
    <p class="muted">Dashboard hosted with the homepage; data still comes from the Cloudflare Worker.</p>
    <p class="health" id="health">Checking worker…</p>
    <form id="login-form">
      <input id="token" type="password" autocomplete="off" placeholder="SUMMARY_TOKEN" required>
      <button type="submit">View statistics</button>
    </form>
    <p id="error" role="alert"></p>
    <section id="stats" hidden>
      <div class="summary">
        <div class="metric"><div class="metric-label">Lifetime views</div><div class="metric-value" id="total">—</div></div>
        <div class="metric"><div class="metric-label">Regions</div><div class="metric-value" id="region-count">—</div></div>
      </div>
      <h2>Views by region</h2>
      <table><thead><tr><th>Country</th><th>State / province</th><th>Views</th></tr></thead><tbody id="regions"></tbody></table>
    </section>
  </main>
  <script>
    const WORKER='https://kevincl16-page-counter.teslacpp.workers.dev';
    const health=document.querySelector('#health');
    const form=document.querySelector('#login-form');
    const tokenInput=document.querySelector('#token');
    const stats=document.querySelector('#stats');
    const error=document.querySelector('#error');
    const total=document.querySelector('#total');
    const regionCount=document.querySelector('#region-count');
    const regions=document.querySelector('#regions');

    async function checkHealth(){
      try{
        // The deployed Worker may predate the newer /health route. A 401 from
        // /summary is the expected unauthenticated response and proves it is up.
        const response=await fetch(WORKER+'/summary',{cache:'no-store'});
        if(response.status===401){
          health.textContent='Worker online';
          return;
        }
        if(response.status===503){
          health.textContent='Worker online · D1 binding missing';
          return;
        }
        if(response.ok){
          health.textContent='Worker online';
          return;
        }
        health.textContent='Worker reachable · HTTP '+response.status;
      }catch(e){
        health.textContent='Worker unavailable';
      }
    }

    async function loadStatistics(token){
      const response=await fetch(WORKER+'/summary',{headers:{Authorization:'Bearer '+token},cache:'no-store'});
      if(!response.ok)throw new Error(response.status===401?'The token was not accepted.':'Counter backend returned HTTP '+response.status+'.');
      return response.json();
    }

    function render(data){
      total.textContent=data.total;
      regionCount.textContent=data.regions.length;
      regions.replaceChildren();
      data.regions.forEach(item=>{
        const row=document.createElement('tr');
        [item.country,item.region,item.views].forEach(value=>{const cell=document.createElement('td');cell.textContent=value;row.appendChild(cell)});
        regions.appendChild(row);
      });
      stats.hidden=false;
      error.textContent='';
    }

    form.addEventListener('submit',async event=>{
      event.preventDefault();
      try{
        render(await loadStatistics(tokenInput.value));
        sessionStorage.setItem('pageview-summary-token',tokenInput.value);
      }catch(e){
        stats.hidden=true;
        error.textContent=e.message;
      }
    });

    const saved=sessionStorage.getItem('pageview-summary-token');
    if(saved)tokenInput.value=saved;
    checkHealth();
  </script>
</body>
</html>
