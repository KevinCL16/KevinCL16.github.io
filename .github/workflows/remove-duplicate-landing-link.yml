name: Remove duplicate landing link

on:
  push:
    paths:
      - '.github/workflows/remove-duplicate-landing-link.yml'

permissions:
  contents: write

jobs:
  fix-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove redundant GitHub link
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('organizing-intelligence-over-time.html')
          text = p.read_text(encoding='utf-8')
          target = '        <a href="https://github.com/KevinCL16/awesome-longitudinal-ai-agents" target="_blank" rel="noopener noreferrer">[GitHub]</a>\n'
          if target not in text:
              raise SystemExit('Target link not found')
          p.write_text(text.replace(target, '', 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add organizing-intelligence-over-time.html
          git commit -m "docs: remove duplicate GitHub link from survey page"
          git push
