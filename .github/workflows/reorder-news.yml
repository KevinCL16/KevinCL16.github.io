name: Reorder news items

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put literature map next to survey
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(\s*<a class="news-item" href="/harness-learning\.html">.*?</a>)(\s*<a class="news-item" href="https://github\.com/KevinCL16/awesome-longitudinal-ai-agents".*?</a>)', re.S)
          m = pattern.search(s)
          if not m:
              raise SystemExit('expected adjacent news items not found')
          s = s[:m.start()] + m.group(2) + m.group(1) + s[m.end():]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "chore: group survey and literature map in News"
          git push
