name: Rename homepage writing section

on:
  push:
    paths:
      - '.github/workflows/rename-writing-section.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename visible writing labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          replacements = {
              '<a href="#writing">Writing</a>': '<a href="#writing">Recent Work</a>',
              '<a class="hero-link" href="#writing">Writing <span aria-hidden="true">↗</span></a>': '<a class="hero-link" href="#writing">Recent Work <span aria-hidden="true">↗</span></a>',
              '<p class="section-label">Writing</p>\n            <h2>A working notebook.</h2>': '<p class="section-label">Recent work</p>\n            <h2>Research, notes, and resources.</h2>',
              'Open the Notion notebook <span aria-hidden="true">↗</span>': 'Notes on Notion <span aria-hidden="true">↗</span>',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Missing target: {old}')
              text = text.replace(old, new, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit homepage update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "docs: rename homepage writing section to recent work"
          git push
