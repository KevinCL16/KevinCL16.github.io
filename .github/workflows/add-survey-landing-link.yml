name: Link survey landing page

on:
  push:
    paths:
      - '.github/workflows/add-survey-landing-link.yml'

permissions:
  contents: write

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add survey card to homepage writing section
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          text = p.read_text()
          if 'data-writing = \'organizing-intelligence-over-time\'' in text or "dataset.writing = 'organizing-intelligence-over-time'" in text:
              raise SystemExit(0)

          marker = "    const harnessPost = document.createElement('a');\n"
          block = """    const surveyPage = document.createElement('a');
    surveyPage.className = 'writing-item';
    surveyPage.dataset.writing = 'organizing-intelligence-over-time';
    surveyPage.href = '/organizing-intelligence-over-time.html';
    surveyPage.innerHTML = [
      '<div class=\"writing-meta\"><span>Sep 2026</span><span>Survey · Position</span></div>',
      '<h3>Organizing Intelligence Over Time</h3>',
      '<p>Human–AI collaboration as joint cognitive development: how present work organization shapes future human, machine, and joint capability.</p>',
      '<span class=\"writing-arrow\" aria-hidden=\"true\">↗</span>'
    ].join('');

"""
          if marker not in text:
              raise SystemExit('Card insertion marker not found')
          text = text.replace(marker, block + marker, 1)

          prepend_marker = "    writingGrid.prepend(awesomeList);\n    writingGrid.prepend(harnessPost);\n"
          prepend_replacement = "    writingGrid.prepend(awesomeList);\n    writingGrid.prepend(harnessPost);\n    writingGrid.prepend(surveyPage);\n"
          if prepend_marker not in text:
              raise SystemExit('Prepend marker not found')
          text = text.replace(prepend_marker, prepend_replacement, 1)
          p.write_text(text)
          PY
      - name: Commit homepage link
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m "feat: link Organizing Intelligence Over Time landing page"
          git push
