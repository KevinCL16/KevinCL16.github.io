name: Refactor recent work to news

on:
  push:
    paths:
      - '.github/workflows/refactor-recent-work-to-news.yml'

permissions:
  contents: write

jobs:
  refactor-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor homepage section
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          def dec(s): return base64.b64decode(s).decode('utf-8')
          old_section = dec('')
          new_section = dec('')
          new_block = dec('')
          css_add = dec('')
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          text = text.replace('<a href="#writing">Recent Work</a>', '<a href="#news">News</a>')
          text = text.replace('<a class="hero-link" href="#writing">Recent Work <span aria-hidden="true">↗</span></a>', '<a class="hero-link" href="#news">News <span aria-hidden="true">↗</span></a>')
          if old_section not in text: raise SystemExit('Recent work section target not found')
          p.write_text(text.replace(old_section, new_section, 1), encoding='utf-8')
          p = Path('script.js')
          text = p.read_text(encoding='utf-8')
          start = text.find("  const writingGrid = document.querySelector('#writing .writing-grid');")
          end = text.find("\n\n  // Both analytics systems share this browser-level opt-out.", start)
          if start == -1 or end == -1: raise SystemExit('Dynamic recent-work block not found')
          p.write_text(text[:start] + new_block + text[end:], encoding='utf-8')
          p = Path('styles.css')
          css = p.read_text(encoding='utf-8')
          if '/* Compact professor-style news feed */' not in css: p.write_text(css + css_add, encoding='utf-8')
          PY
      - name: Commit refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html script.js styles.css
          git commit -m "style: turn recent work into compact news feed"
          git push
