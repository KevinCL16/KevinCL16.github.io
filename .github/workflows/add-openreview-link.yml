name: Add OpenReview link

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-openreview-link.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add OpenReview link to OIOT landing page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('organizing-intelligence-over-time.html')
          s = p.read_text()
          needle = '        <a href="/Organizing_Intelligence_Over_Time_v1_2026-09-12.pdf" target="_blank" rel="noopener noreferrer">[PDF]</a>\n        <a href="https://github.com/KevinCL16/awesome-longitudinal-ai-agents" target="_blank" rel="noopener noreferrer">[Literature Map]</a>'
          replacement = '        <a href="/Organizing_Intelligence_Over_Time_v1_2026-09-12.pdf" target="_blank" rel="noopener noreferrer">[PDF]</a>\n        <a href="https://openreview.net/forum?id=Ad9jfySutr" target="_blank" rel="noopener noreferrer">[OpenReview]</a>\n        <a href="https://github.com/KevinCL16/awesome-longitudinal-ai-agents" target="_blank" rel="noopener noreferrer">[Literature Map]</a>'
          if 'https://openreview.net/forum?id=Ad9jfySutr' not in s:
              if needle not in s:
                  raise SystemExit('Expected landing-page link block not found')
              s = s.replace(needle, replacement, 1)
              p.write_text(s)
          PY

      - name: Commit update and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/add-openreview-link.yml
          git add organizing-intelligence-over-time.html
          git commit -m "Add OpenReview link to OIOT landing page"
          git push
