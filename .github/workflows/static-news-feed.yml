name: Static homepage news feed

on:
  push:
    paths:
      - '.github/workflows/static-news-feed.yml'

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make all news rows static
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          start = text.find('        <div class="news-list">')
          end = text.find('        </div>\n      </div>\n    </section>', start)
          if start == -1 or end == -1:
              raise SystemExit('news-list block not found')
          end += len('        </div>')
          rows = [
              '        <div class="news-list">',
              '          <a class="news-item" data-news="organizing-intelligence-over-time" href="/organizing-intelligence-over-time.html">',
              '            <time class="news-date">Sep 2026</time>',
              '            <span class="news-type">Survey · Position</span>',
              '            <span class="news-text"><strong>Organizing Intelligence Over Time</strong><span class="news-summary"> — Human–AI collaboration as joint cognitive development.</span></span>',
              '            <span class="news-arrow" aria-hidden="true">↗</span>',
              '          </a>',
              '          <a class="news-item" href="/harness-learning.html">',
              '            <time class="news-date">Sep 2026</time>',
              '            <span class="news-type">Essay</span>',
              '            <span class="news-text"><strong>The Harness Learning Stack</strong><span class="news-summary"> — A post-training-like stack around environments, trajectories, graders, credit assignment, and harness updates.</span></span>',
              '            <span class="news-arrow" aria-hidden="true">↗</span>',
              '          </a>',
              '          <a class="news-item" href="https://github.com/KevinCL16/awesome-longitudinal-ai-agents" target="_blank" rel="noopener noreferrer">',
              '            <time class="news-date">Sep 2026</time>',
              '            <span class="news-type">Literature map</span>',
              '            <span class="news-text"><strong>Awesome Longitudinal AI Agents</strong><span class="news-summary"> — A curated map of research on agents and Human–AI systems that change through accumulated experience.</span></span>',
              '            <span class="news-arrow" aria-hidden="true">↗</span>',
              '          </a>',
              '          <a class="news-item" href="https://kelvinyang.notion.site/AI-3b09cede387180fbb669f3065c483746" target="_blank" rel="noopener noreferrer">',
              '            <time class="news-date">Aug 2026</time>',
              '            <span class="news-type">Essay</span>',
              '            <span class="news-text"><strong>AI 的下一场竞争，不是模型能力，而是经验循环</strong><span class="news-summary"> — 关于真实人机交互经验如何被记录、提炼，并重新进入个人或组织的学习循环。</span></span>',
              '            <span class="news-arrow" aria-hidden="true">↗</span>',
              '          </a>',
              '        </div>',
          ]
          text = text[:start] + '\n'.join(rows) + text[end:]
          p.write_text(text, encoding='utf-8')
          PY
      - name: Commit static news feed
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix: render all homepage news items statically"
          git push
