name: Update survey longitudinal wording

on:
  push:
    paths:
      - '.github/workflows/update-survey-longitudinal-wording.yml'

permissions:
  contents: write

jobs:
  update-wording:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace overview sentence
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('organizing-intelligence-over-time.html')
          text = p.read_text(encoding='utf-8')
          old = 'The survey treats repeated Human–AI collaboration as a changing system rather than repeated task completion by a fixed team.'
          new = 'The survey treats longitudinal Human–AI collaboration as a changing system rather than a sequence of tasks completed by a fixed team.'
          if old not in text:
              raise SystemExit('Target sentence not found')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add organizing-intelligence-over-time.html
          git commit -m "docs: use longitudinal framing on survey page"
          git push
