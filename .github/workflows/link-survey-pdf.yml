name: Link survey PDF

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link PDF from survey landing page
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('organizing-intelligence-over-time.html')
          s = p.read_text(encoding='utf-8')
          old = '        <span class="forthcoming">[Preprint forthcoming]</span>'
          new = '        <a href="/Organizing_Intelligence_Over_Time_v1_2026-09-12.pdf" target="_blank" rel="noopener noreferrer">[PDF]</a>'
          if old not in s:
              raise SystemExit('landing-page preprint placeholder not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/link-survey-pdf.yml
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add organizing-intelligence-over-time.html .github/workflows/link-survey-pdf.yml
          git commit -m "feat: link survey PDF from landing page"
          git push
