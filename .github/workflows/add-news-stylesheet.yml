name: Add news stylesheet

on: [push]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add dedicated news stylesheet
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<link rel="stylesheet" href="styles.css?v=academic-compact4">'
          new = old + '\n  <link rel="stylesheet" href="news.css?v=2">'
          if 'news.css?v=2' not in s:
              if old not in s:
                  raise SystemExit('stylesheet anchor not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "fix: load dedicated news feed stylesheet"
          git push
